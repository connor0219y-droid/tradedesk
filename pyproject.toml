[project]
name = "tradedesk"
version = "0.1.0"
description = "Intraday research companion for TradingView paper trading. Never places orders."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5",
    "duckdb>=1.1",
    "polars>=1.21",
    "pyarrow>=25.0.0",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
tradedesk = "tradedesk.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:tradedesk.*"]
# `store` reads the real 4-year DuckDB file. Excluded from the default run for speed;
# invoked by `make levels-sweep`. It skips WITH A REASON when the store is absent.
addopts = "-m 'not store'"
markers = ["store: requires the real candle store (slow)"]

[dependency-groups]
dev = [
    "pytest>=8",
]
